if(!Array.isArray(sessions)){const old=JSON.parse(localStorage.getItem('yanki-chat-history')||'[]');sessions=[{id:uid(),title:'Önceki sohbet',updatedAt:Date.now(),messages:old}];activeId=sessions[0].id}
function uid(){return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markdown(t){let e=esc(t);e=e.replace(/```([\s\S]*?)```/g,(_,x)=>'<pre><code>'+x.trim()+'</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');return e.split(/\n\n+/).map(p=>/^<(h[1-3]|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
function current(){return sessions.find(s=>s.id===activeId)}
function persist(){const s=current();if(s){s.updatedAt=Date.now();const first=s.messages.find(m=>m.role==='user'&&m.content);if(first&&(s.title==='Yeni sohbet'||s.title==='Önceki sohbet'))s.title=first.content.slice(0,42)}localStorage.setItem('morph-chat-sessions',JSON.stringify(sessions));localStorage.setItem('morph-active-chat',activeId);renderHistory()}
function renderHistory(){const list=$('#historyList');list.innerHTML=sessions.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(s=>'<button class="history-row '+(s.id===activeId?'active':'')+'" data-chat="'+esc(s.id)+'" title="'+esc(s.title)+'">'+esc(s.title||'Yeni sohbet')+'</button>').join('')||'<div class="history-empty">Henüz sohbet yok.</div>';list.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{activeId=b.dataset.chat;persist();draw()})}
function draw(){const s=current();messages.innerHTML='';const empty=!s||!s.messages.length;$('.main').classList.toggle('empty-state',empty);if(empty){messages.innerHTML='<div class="welcome"><div class="orb">M</div><h1>Nereden başlayalım?</h1><p>Merak ettiğini sor. MORPH düşüncelerini birlikte şekillendirsin.</p><div class="suggestions"><button>Bir konu hakkında bilgi ver</button><button>Bir metni özetle</button><button>Fikir üretmeme yardım et</button></div></div>';messages.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{prompt.value=b.textContent;prompt.focus()});return}for(const m of s.messages){const row=document.createElement('div');row.className='msg '+m.role;row.innerHTML='<div class="avatar">'+(m.role==='user'?'◉':'M')+'</div><div class="content"></div>';const content=row.querySelector('.content');content.innerHTML=m.role==='assistant'?markdown(m.content):esc(m.content).replace(/\n/g,'<br>');if(Array.isArray(m.images)&&m.images.length){const gallery=document.createElement('div');gallery.className='message-images';for(const src of m.images){if(!/^data:image\/(?:jpeg|png|webp);base64,/.test(src))continue;const img=document.createElement('img');img.src=src;img.alt='Sohbete eklenen görsel';gallery.append(img)}content.append(gallery)}messages.append(row)}messages.scrollTop=messages.scrollHeight}async function loadStatus(){try{const r=await fetch('/api/health'),d=await r.json();const warning=$('#configWarning');if(warning)warning.hidden=!!d.configured}catch{const warning=$('#configWarning');if(warning){warning.textContent='Sunucuya bağlanılamadı. Biraz sonra sayfayı yenile.';warning.hidden=false}}}
function newChat(){const s={id:uid(),title:'Yeni sohbet',updatedAt:Date.now(),messages:[]};sessions.unshift(s);activeId=s.id;persist();draw();prompt.focus()}
function renderAttachments(){attachmentStrip.innerHTML='';attachmentStrip.hidden=!attachments.length;attachments.forEach((src,index)=>{const tile=document.createElement('div');tile.className='attachment';const img=document.createElement('img');img.src=src;img.alt='Yapıştırılan fotoğraf';const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Fotoğrafı kaldır');remove.onclick=()=>{attachments.splice(index,1);renderAttachments()};tile.append(img,remove);attachmentStrip.append(tile)})}
function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Fotoğraf okunamadı.'));reader.onload=async()=>{try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,1280/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();canvas.toBlob(blob=>{if(!blob)return reject(Error('Fotoğraf dönüştürülemedi.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Fotoğraf okunamadı.'));r.readAsDataURL(blob)},'image/jpeg',.76)}catch(e){reject(e)}};reader.readAsDataURL(file)})}
async function pasteImages(items){const files=Array.from(items).map(item=>item.kind==='file'&&item.type.startsWith('image/')?item.getAsFile():null).filter(Boolean);if(!files.length)return;modelSelect.value=visionModel;localStorage.setItem('morph-model',visionModel);const room=Math.max(0,3-attachments.length);for(const file of files.slice(0,room)){try{attachments.push(await readImage(file))}catch(e){alert(e.message)}}if(files.length>room)alert('Bir mesaja en fazla 3 fotoğraf eklenebilir.');renderAttachments();prompt.focus()}
async function send(){const text=prompt.value.trim();if((!text&&!attachments.length)||busy)return;const s=current();if(!s)return;const images=attachments.slice();s.messages.push({role:'user',content:text,images});attachments=[];renderAttachments();persist();draw();prompt.value='';busy=true;$('#sendBtn').disabled=true;const wait=document.createElement('div');wait.className='msg';wait.innerHTML='<div class="avatar">M</div><div class="content typing">Yanıt hazırlanıyor…</div>';messages.append(wait);messages.scrollTop=messages.scrollHeight;try{const vision=modelSelect.value===visionModel;const payload={model:modelSelect.value,messages:s.messages.map(m=>({role:m.role,content:m.content,...(vision&&m.images?.length?{images:m.images}:{})}))};const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'İstek başarısız (HTTP '+r.status+')');if(!d.message?.content)throw Error('Model boş yanıt verdi.');s.messages.push({role:'assistant',content:d.message.content});persist();wait.remove();draw()}catch(e){wait.remove();s.messages.push({role:'assistant',content:'Yanıt alınamadı: '+e.message});persist();draw()}finally{busy=false;$('#sendBtn').disabled=false;prompt.focus()}}
$('#newChat').onclick=newChat;$('#sendBtn').onclick=send;prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};function onPaste(e){const items=e.clipboardData?.items;if(items&&Array.from(items).some(item=>item.kind==='file'&&item.type.startsWith('image/'))){e.preventDefault();pasteImages(items)}}prompt.onpaste=onPaste;document.addEventListener('paste',e=>{if(e.target!==prompt)onPaste(e)});prompt.addEventListener('dragover',e=>{e.preventDefault();$('.composer').classList.add('dragging')});prompt.addEventListener('dragleave',()=>$('.composer').classList.remove('dragging'));prompt.addEventListener('drop',e=>{e.preventDefault();$('.composer').classList.remove('dragging');pasteImages(Array.from(e.dataTransfer.files).map(file=>({kind:'file',type:file.type,getAsFile:()=>file}))) });if(!sessions.length)newChat();else{if(!current())activeId=sessions[0].id;renderHistory();draw()}const shell=document.querySelector('.shell');const storedCollapse=localStorage.getItem('morph-sidebar-collapsed')==='true';if(storedCollapse)shell.classList.add('sidebar-collapsed');$('#sidebarToggle').setAttribute('aria-expanded',String(!storedCollapse));$('#sidebarToggle').onclick=()=>{const closed=shell.classList.toggle('sidebar-collapsed');$('#sidebarToggle').setAttribute('aria-expanded',String(!closed));localStorage.setItem('morph-sidebar-collapsed',String(closed))};loadStatus();
})();
</script></body></html>
